# Runtime for Duo flows in this project. Undertaker uses coding_environment: none and never clones,
# so this only matters for foundational flows (e.g. Fix CI/CD Pipeline) that run here.
image: node:22-bookworm-slim
setup_script:
  - apt-get update -qq && apt-get install -y -qq git curl > /dev/null
  - npm ci --no-audit --no-fund
  - npm ci --prefix app --no-audit --no-fund
cache:
  key:
    files:
      - package-lock.json
      - app/package-lock.json
  paths:
    - node_modules/
    - app/node_modules/
