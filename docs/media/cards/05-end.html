<style>
:root{--paper:#f4f1ea;--card:#fbf9f4;--ink:#1c1a17;--muted:#6d675d;--line:#d9d3c6;--assisted:#b45309;--supervised:#1d4ed8;--hands:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px}
body{position:relative;background:var(--paper);color:var(--ink);font:28px/1.5 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:72px 112px;display:flex;flex-direction:column}
.head,.foot{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.head{padding-bottom:22px;border-bottom:2px solid var(--ink)}
.foot{margin-top:auto;padding-top:22px;border-top:1px solid var(--line);letter-spacing:.04em;text-transform:none}
.serif{font-family:Fraunces,Georgia,serif;font-weight:600;font-optical-sizing:auto}
code{font-family:inherit;color:var(--ink)}
/* Fraunces italics default to "wonky" swash forms (a long-s style l) at display sizes; turn them off. */
.serif em{font-variation-settings:"WONK" 0;letter-spacing:0}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.stone{width:120px;height:150px;border:3px solid var(--ink);border-bottom-width:3px;border-radius:60px 60px 6px 6px;display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;letter-spacing:.14em;color:var(--muted);margin-bottom:56px;position:relative}
.stone::after{content:"";position:absolute;left:-40px;right:-40px;bottom:-14px;height:3px;background:var(--line)}
h1{font-size:132px;line-height:1.02;letter-spacing:-.02em;margin:0}
h1 em{font-style:italic}
.line{margin-top:56px;font-size:30px;color:var(--muted);letter-spacing:.06em}
.line b{color:var(--ink);font-weight:600}
.levels{display:flex;gap:28px;margin-top:28px;font-size:22px;letter-spacing:.12em;text-transform:uppercase}
.levels span{display:flex;align-items:center;gap:10px}.levels i{width:28px;height:6px;border-radius:3px;display:inline-block}
