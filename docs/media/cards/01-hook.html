<!doctype html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080">
<title>Probation — hook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..600,0..100,0..1;1,9..144,600,0..100,0..1&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1ea;--card:#fbf9f4;--ink:#1c1a17;--muted:#6d675d;--line:#d9d3c6;--assisted:#b45309;--supervised:#1d4ed8;--hands:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px}
body{position:relative;background:var(--paper);color:var(--ink);font:28px/1.5 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:72px 112px;display:flex;flex-direction:column}
.head,.foot{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.head{padding-bottom:22px;border-bottom:2px solid var(--ink)}
.foot{margin-top:auto;padding-top:22px;border-top:1px solid var(--line);letter-spacing:.04em;text-transform:none}
.serif{font-family:Fraunces,Georgia,serif;font-weight:600;font-optical-sizing:auto}
code{font-family:inherit;color:var(--ink)}
/* Fraunces italics default to "wonky" swash forms (a long-s style l) at display sizes; turn them off. */
.serif em{font-variation-settings:"WONK" 0;letter-spacing:0}
.main{flex:1;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:36px}
h1{font-size:168px;line-height:1;letter-spacing:-.02em;margin:0}
h1 em{display:block;font-style:italic;margin-top:18px}
.mark{display:inline-block;position:relative}
.mark::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:10px;background:var(--line);z-index:-1}
</style></head><body><div class="frame">
<div class="head"><span>Probation + Undertaker</span><span>File No. 01</span></div>
<div class="main">
  <div class="kicker">Statement of the problem</div>
  <h1 class="serif">Code generation is&nbsp;solved.<em><span class="mark">Deletion</span> isn’t.</em></h1>
</div>
<div class="foot"><span>Nobody lets an AI delete code. Nobody lets an AI ship alone.</span><span>So we put one on probation.</span></div>
</div></body></html>
